apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognideck-deployment
  labels:
    app: cognideck
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cognideck
  template:
    metadata:
      labels:
        app: cognideck
    spec:
      containers:
      - name: cognideck
        image: visheshshah20/cognideck:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
